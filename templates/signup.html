{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="brand-font">EqualLink</span>
    <div class="tagline" style="color:var(--el-teal);font-size:1.5rem;">Sign up</div>
    <form method="post">
      <div class="mb-3 text-start">
        <label class="form-label fw-bold small">Sign up as:</label>
        <select class="form-select" name="role">
          <option value="volunteer">Volunteer</option>
          <option value="organisation">Organisation</option>
        </select>
      </div>
      <div class="mb-3">
        <input class="form-control" type="text" name="username" placeholder="User name" required>
      </div>
      <div class="mb-3">
        <input class="form-control" type="email" name="email" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input class="form-control" type="password" name="password" placeholder="Password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign up</button>
      <div class="form-check d-flex justify-content-center gap-2 mt-3">
        <input class="form-check-input" type="checkbox" name="remember" id="remember">
        <label class="form-check-label small" for="remember">Remember me</label>
      </div>
    </form>
    <div class="text-center small mt-3">
      Already have an account?<br>
      <a class="fw-bold" style="color:var(--el-coral);" href="{{ url_for('login') }}">Log in!</a>
    </div>
  </div>
</div>
{% endblock %}
